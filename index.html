<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luvital - Contacto & Reseñas</title>
  <style>
    /* Reset y estilos generales */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f4f7f9;
      color: #2c3e50;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    /* Tarjeta contenedora */
    .container {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

  /* Estilo del Logo */
    .logo-img {
      width: 120px;            /* Controla el ancho del logo */
      height: 120px;           /* Controla la altura del logo */
      object-fit: contain;    /* Evita que la imagen se distorsione */
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.35rem;
      color: #0f4c81;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #6c757d;
      margin-bottom: 20px;
    }

    /* Sección Destacada: Reseña de Google */
    .btn-featured {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #1a73e8, #1557b0);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 14px;
      box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3);
      transition: transform 0.2s;
    }

    /* Botones Secundarios */
    .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      background-color: #ffffff;
      color: #2c3e50;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      transition: all 0.2s;
    }

    /* Efectos al presionar */
    .btn-featured:active, .btn-secondary:active {
      transform: scale(0.98);
    }
    .btn-secondary:hover {
      background-color: #f8fafc;
      border-color: #cbd5e1;
    }

    /* Pie de página */
    .footer-text {
      margin-top: 16px;
      font-size: 0.75rem;
      color: #94a3b8;
    }
  </style>
</head>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<body>

  <div class="container">
    <!-- Icono o Logo -->
    <img src="logoluv.png" alt="logo clinica" class="logo-img">
    <h1>Luvital</h1>
    <p class="subtitle"> Enfocado en la salud dental de los Tulumenses</p>

    <!-- Icono de Estrellas de Google -->
<a href="https://maps.google.com/..." class="btn btn-google">
  <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i> Dejar Reseña en Google
</a>

    <!-- Icono de WhatsApp -->
<a href="https://wa.me/529841234567" class="btn btn-whatsapp">
  <i class="fa-brands fa-whatsapp"></i> Contactar por WhatsApp
</a>

   <!-- Icono de Mapa / Ubicación -->
<a href="https://maps.google.com/..." class="btn btn-maps">
  <i class="fa-solid fa-location-dot"></i> Cómo Llegar (Ubicación)
</a>

    <!-- Instagram / Menú de servicios -->
  <a href="https://instagram.com/tu_usuario" class="btn btn-instagram" target="_blank">
    <i class="fa-brands fa-instagram"></i> Menú de Servicios
  </a>

    <p class="footer-text">Toca cualquiera de las opciones para ir directo</p>
  </div>

</body>
</html>
