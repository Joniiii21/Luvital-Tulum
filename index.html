<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luvital - Contacto & Reseñas</title>
  
  <!-- pagina de iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* Estilos  */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a; /* Fondo oscuro de respaldo */
      color: #2c3e50;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Estilo Video de Fondo */
    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
      filter: blur(5px) scale(1.05); /* Difuminado suave */
    }

    /* Capa oscura */
    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.65); /* Oscurece para mejor lectura */
      z-index: -1;
    }

    /* Efecto cristal */
    .container {
      width: 100%;
      max-width: 380px;
      background: rgba(255, 255, 255, 0.93); /* Blanco semi-transparente */
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    /* tamaño del logo */
    .logo-img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.35rem;
      color: #0f4c81;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #6c757d;
      margin-bottom: 24px;
    }

    /* Reseña de Google */
    .btn-featured {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #1a73e8, #1557b0);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 14px;
      box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3);
      transition: transform 0.2s;
    }

    /* Botones Secundarios */
    .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      background-color: #ffffff;
      color: #2c3e50;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      transition: all 0.2s;
    }

    /* Estilos iconos dentro de los botones */
    .btn-featured i, .btn-secondary i {
      font-size: 1.15rem;
    }
    
    /* Colores para los iconos */
    .fa-star {
      color: #fbbc04; /* amarillo estrellas */
    }
    .fa-whatsapp {
      color: #25d366; /* verde WhatsApp */
    }
    .fa-location-dot {
      color: #ea4335; /* Rojo Google Maps */
    }
    .fa-instagram {
      color: #e1306c; /* Rosado Instagram */
    }
    .fa-facebook {
      color: #1877f2; /* Azul Facebook */
    }

    /* Efectos al presionar */
    .btn-featured:active, .btn-secondary:active {
      transform: scale(0.98);
    }
    .btn-secondary:hover {
      background-color: #f8fafc;
      border-color: #cbd5e1;
    }

    /* Pie de página */
    .footer-text {
      margin-top: 16px;
      font-size: 0.75rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <!-- Video loop defondo -->
  <video autoplay loop muted playsinline class="bg-video">
    <source src="vidloop.mp4" type="video/mp4">
  </video>
  
  <!-- Capa oscura superpuesta -->
  <div class="bg-overlay"></div>

  <div class="container">
    <!-- Logo -->
    <img src="logoluv.png" alt="logo clinica" class="logo-img">
    <h1>Luvital</h1>
    <p class="subtitle">Enfocado en la salud dental de los Tulumenses</p>

    <!-- Botón Reseña google -->
    <a href="https://g.page/r/CZT7aVdfVu5SEBM/review" target="_blank" class="btn-featured">
      <i class="fa-solid fa-star"></i> Dejar Reseña en Google
    </a>

    <!-- Boton Agendar por WhatsApp -->
    <a href="https://wa.me/529841873403?text=Hola,%20quisiera%20agendar%20una%20cita" target="_blank" class="btn-secondary">
      <i class="fa-brands fa-whatsapp"></i> Agendar Cita por WhatsApp
    </a>

    <!-- Boton Ubicación -->
    <a href="https://maps.app.goo.gl/9ZtXss2aP8SA1PSe9" target="_blank" class="btn-secondary">
      <i class="fa-solid fa-location-dot"></i> Cómo llegar (Google Maps)
    </a>

    <!-- Boton Instagram -->
    <a href="https://www.instagram.com/luvitalconsultoriodental" target="_blank" class="btn-secondary">
      <i class="fa-brands fa-instagram"></i> Mira nuestros Tratamientos
    </a>

    <!-- Boton Facebook -->
    <a href="https://www.facebook.com/share/1DivYdAotk/" target="_blank" class="btn-secondary">
      <i class="fa-brands fa-facebook"></i> Síguenos en Facebook
    </a>

    <p class="footer-text">Toca cualquiera de las opciones para ir directo</p>
  </div>

</body>
</html>
