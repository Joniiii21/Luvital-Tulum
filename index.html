<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luvital - Contacto & Reseñas</title>
  
  <!-- Librería de Iconos Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* Reset y estilos generales */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f4f7f9;
      color: #2c3e50;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    /* Tarjeta contenedora */
    .container {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    /* Estilo del Logo */
    .logo-img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.35rem;
      color: #0f4c81;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #6c757d;
      margin-bottom: 20px;
    }

    /* Tarjeta Wi-Fi Pacientes */
    .wifi-card {
      background-color: #eef6ff;
      border: 1px solid #bedbfe;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .wifi-card p {
      font-size: 0.85rem;
      color: #1e40af;
      margin-bottom: 8px;
    }
    .btn-wifi {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn-wifi:active {
      transform: scale(0.96);
      background-color: #1d4ed8;
    }
    .mensaje-oculto {
      display: none;
      font-size: 0.75rem;
      color: #16a34a;
      margin-top: 6px;
      font-weight: 600;
    }

    /* Sección Destacada: Reseña de Google */
    .btn-featured {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #1a73e8, #1557b0);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 14px;
      box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3);
      transition: transform 0.2s;
    }

    /* Botones Secundarios */
    .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      background-color: #ffffff;
      color: #2c3e50;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      transition: all 0.2s;
    }

    /* Estilos específicos para los iconos dentro de los botones */
    .btn-featured i, .btn-secondary i {
      font-size: 1.15rem;
    }
    
    /* Colores personalizados para los iconos */
    .fa-star {
      color: #fbbc04; /* Color dorado para las estrellas */
    }
    .fa-whatsapp {
      color: #25d366; /* Verde oficial WhatsApp */
    }
    .fa-location-dot {
      color: #ea4335; /* Rojo oficial Google Maps */
    }
    .fa-instagram {
      color: #e1306c; /* Rosado oficial Instagram */
    }
    .fa-wifi {
      color: #2563eb; /* Azul Wi-Fi */
    }

    /* Efectos al presionar */
    .btn-featured:active, .btn-secondary:active {
      transform: scale(0.98);
    }
    .btn-secondary:hover {
      background-color: #f8fafc;
      border-color: #cbd5e1;
    }

    /* Pie de página */
    .footer-text {
      margin-top: 16px;
      font-size: 0.75rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Logo -->
    <img src="logoluv.png" alt="logo clinica" class="logo-img">
    <h1>Luvital</h1>
    <p class="subtitle">Enfocado en la salud dental de los Tulumenses</p>

    <!-- Bloque Wi-Fi -->
    <div class="wifi-card">
      <p><i class="fa-solid fa-wifi"></i> <strong>Wi-Fi Pacientes:</strong> Luvital_Guest</p>
      <button class="btn-wifi" onclick="copiarWifi()">
        <i class="fa-regular fa-copy"></i> Copiar Contraseña
      </button>
      <div id="mensaje-copiado" class="mensaje-oculto">¡Contraseña copiada al portapapeles!</div>
    </div>

    <!-- Botón Reseña gogole -->
    <a href="https://g.page/r/CZT7aVdfVu5SEBM/review" target="_blank" class="btn-featured">
      <i class="fa-solid fa-star"></i> Dejar Reseña en Google
    </a>

    <!-- Botón Agendar por WhatsApp -->
    <a href="https://wa.me/529841873403?text=Hola,%20quisiera%20agendar%20una%20cita" target="_blank" class="btn-secondary">
      <i class="fa-brands fa-whatsapp"></i> Agendar Cita por WhatsApp
    </a>

    <!-- Botón Ubicación -->
    <a href="https://maps.app.goo.gl/9ZtXss2aP8SA1PSe9" target="_blank" class="btn-secondary">
      <i class="fa-solid fa-location-dot"></i> Cómo llegar (Google Maps)
    </a>

    <!-- Botón Instagram -->
    <a href="https://www.instagram.com/luvitalconsultoriodental" target="_blank" class="btn-secondary">
      <i class="fa-brands fa-instagram"></i> Ver Casos & Tratamientos
    </a>

    <p class="footer-text">Toca cualquiera de las opciones para ir directo</p>
  </div>

  <!-- funcion copiar contraseña -->
  <script>
    function copiarWifi() {
      // Contraseña real
      const passwordReal = "vwfpfsz"; 
      
      navigator.clipboard.writeText(passwordReal).then(() => {
        const mensaje = document.getElementById("mensaje-copiado");
        mensaje.style.display = "block";
        
        setTimeout(() => {
          mensaje.style.display = "none";
        }, 3000);
      }).catch(err => {
        console.error('Error al copiar: ', err);
      });
    }
  </script>

</body>
</html>
