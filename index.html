<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luvital - Contacto & Reseñas</title>
  
  <!-- Pagina de iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* Estilos generales */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 32px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Video de Fondo */
    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
      filter: blur(3px) scale(1.03); /* Ligeramente difuminado */
    }

    /* Capa oscura superpuesta */
    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.55); /* Capa traslúcida para legibilidad */
      z-index: -1;
    }

    /* Contenedor central (Sin tarjeta contenedora fija) */
    .container {
      width: 100%;
      max-width: 380px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Logo destacado con resplandor para no opacarse */
    .logo-wrapper {
      width: 130px;
      height: 130px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      padding: 12px;
    }
    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Encabezados claros sobre el video */
    h1 {
      font-size: 1.6rem;
      color: #ffffff;
      font-weight: 700;
      margin-bottom: 6px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }
    .subtitle {
      font-size: 0.9rem;
      color: #e2e8f0;
      margin-bottom: 28px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      font-weight: 500;
    }

    /* Botón Principal (Google) */
    .btn-featured {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      margin-bottom: 14px;
      background: linear-gradient(135deg, #1a73e8, #1557b0);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(26, 115, 232, 0.4);
      transition: transform 0.2s;
    }

    /* Botones Secundarios Glassmorphism */
    .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.92);
      color: #1e293b;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 14px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.4);
      transition: all 0.2s;
    }

    /* Tamaño de Iconos */
    .btn-featured i, .btn-secondary i {
      font-size: 1.15rem;
    }
    
    /* Colores personalizados para los iconos */
    .fa-star {
      color: #fbbc04;
    }
    .fa-whatsapp {
      color: #25d366;
    }
    .fa-location-dot {
      color: #ea4335;
    }
    .fa-instagram {
      color: #e1306c;
    }
    .fa-facebook {
      color: #1877f2;
    }

    /* Efectos táctiles */
    .btn-featured:active, .btn-secondary:active {
      transform: scale(0.97);
    }

    /* Pie de página */
    .footer-text {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #cbd5e1;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>

  <!-- Video loop de fondo -->
  <video autoplay loop muted playsinline class="bg-video">
    <source src="VIDLOOP.mp4" type="video/mp4">
  </video>
  
  <!-- Capa oscura superpuesta -->
  <div class="bg-overlay"></div>

  <div class="container">
    <!-- Contenedor del Logo destacado -->
    <div class="logo-wrapper">
      <img src="logoluv.png" alt="logo clinica" class="logo-img">
    </div>

    <h1>Luvital</h1>
    <p class="subtitle">Enfocado en la salud dental de los Tulumenses</p>

    <!-- Botón Reseña google -->
    <a href="https://g.page/r/CZT7aVdfVu5SEBM/review" target="_blank" class="btn-featured">
      <i class="fa-solid fa-star"></i> Dejar Reseña en Google
    </a>

    <!-- Botón Agendar por WhatsApp -->
    <a href="https://wa.me/529841873403?text=Hola,%20quisiera%20agendar%20una%20cita" target="_blank" class="btn-secondary">
      <i class="fa-brands fa-whatsapp"></i> Agendar Cita por WhatsApp
    </a>

    <!-- Botón Ubicación -->
    <a href="https://maps.app.goo.gl/9ZtXss2aP8SA1PSe9" target="_blank" class="btn-secondary">
      <i class="fa-solid fa-location-dot"></i> Cómo llegar (Google Maps)
    </a>

    <!-- Botón Instagram -->
    <a href="https://www.instagram.com/luvitalconsultoriodental" target="_blank" class="btn-secondary">
      <i class="fa-brands fa-instagram"></i> Mira nuestros Tratamientos
    </a>

    <!-- Botón Facebook -->
    <a href="https://www.facebook.com/share/1DivYdAotk/" target="_blank" class="btn-secondary">
      <i class="fa-brands fa-facebook"></i> Síguenos en Facebook
    </a>

    <p class="footer-text">Toca cualquiera de las opciones para ir directo</p>
  </div>

</body>
</html>
